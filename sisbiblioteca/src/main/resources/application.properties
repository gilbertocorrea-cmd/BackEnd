spring.application.name=sisbiblioteca

# H2 em memória: os dados existem enquanto a aplicação estiver em execução.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Dialeto SQL utilizado pelo Hibernate para o banco H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Mostra no terminal o SQL produzido pelo JPA, com formatação legível.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Acesse http://localhost:8080/h2-console e use a URL, usuário e senha acima.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
